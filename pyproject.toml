[project]
name = "robot-agent"
version = "0.1.0"
description = "Layered LangGraph VLA agent with deterministic robot simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "dexos-lite>=0.2.2",
    "httpx[socks]>=0.28.1",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.3",
    "langgraph>=1.2.22",
    "lark-oapi>=1.8.0",
    "opencv-python>=5.1.0.95",
    "pydantic>=2.14.3",
    "pyrealsense2>=2.59.2.11152",
    "pysocks>=1.7.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "socksio>=1.0.0",
    "sqlalchemy>=1.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_agent"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project.scripts]
vla-agent = "vla_agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keep tests isolated from unrelated system plugins; only built-in plugins are needed.
addopts = "--disable-plugin-autoload"
